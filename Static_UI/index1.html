<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>My First HTML Structure</title>
    <meta name="description" content="Basic HTML Tutorial" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      #content-area {
        display: flex;
        flex-direction: row;
        padding: 10px;
        margin-top: 10px;
        background-color: #abcd69;
      }
      .card {
        margin: 10px;
        padding: 5px;
        background-color: #aae3aa; 
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="content-area">
      <div class="card">div1</div>
      <div class="card">div2</div>
      <div class="card">div3</div>
    </div>
  </body>
</html>
